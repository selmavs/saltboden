<!DOCTYPE html>

<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <header class="header">
        <p class="header__logo">Saltboden</p>
        <button class="header__button">
            <img src="/images/menu-icon.svg" alt="">
            Meny
        </button>

        <nav class="nav">
            <ul class="nav__links">
                <li><a href="index.html" class="nav__link">Start</a></li>
                <li><a href="menu.html" class="nav__link">Meny</a></li>
                <li><a href="about.html" class="nav__link">Om oss</a></li>
                <li><a href="contact.html" class="nav__link" aria-current="page">Kontakt</a></li>
                <li><a href="booking.html" class="nav__link nav__link--booking">Boka bord</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="container">
            <h1>Kontakt</h1>
            <div class="content">
                <section class="contact">
                    <img src="" alt="">

                    <div class="contact__info">
                        <div>
                            <h2 class="contact__heading">Adress</h2>
                            <address>
                                <p>Kajgatan 4</p>
                                <p>123 45 Hamnstad</p>
                            </address>
                        </div>

                        <div>
                            <h2 class="contact__heading">Telefon & e-post</h2>
                            <address class="contact__details">
                                <a href="tel:0101234567">010-123 45 67</a>
                                <a href="mailto:hej@saltboden.se">hej@saltboden.se</a>
                            </address>
                        </div>
                    </div>
                </section>

                <section class="questions">
                    <h2>Vanliga frågor</h2>
                </section>
            </div>

            <form action="#">
                <fieldset>
                    <legend>Skicka ett meddelande</legend>
                </fieldset>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p class="footer__logo">Saltboden</p>
        <address>
            <p class="footer__address">Kajgatan 4, 123 45 Hamnstad</p>
            <div class="footer__info">
                <a class="footer__phone" href="tel:0101234567">010-123 45 67</a>
                <span class="footer__dot" aria-hidden="true">•</span>
                <a class="footer__mail" href="mailto:hej@saltboden.se">hej@saltboden.se</a>
            </div>
        </address>
        <div>
            <a href="#" class="footer__social">Instagram</a>
